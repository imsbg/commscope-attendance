name: Update Attendance Data

on:
  schedule:
    - cron: '*/30 * * * *' # Runs automatically every 30 minutes
  push:
    paths-ignore:
      - 'data.json' # CRITICAL: Prevents an infinite loop when the bot updates the data
  workflow_dispatch: # Allows manual trigger from your HTML Admin Console

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the new data.json back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Node 18+ is required to use the built-in fetch() API

      - name: Install Dependencies
        run: npm install

      - name: Run PDF Parser Script
        run: node parser.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          # Check if there are changes to commit, if so, commit and push
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update attendance data.json" && git push)
